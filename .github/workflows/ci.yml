name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_secrets.py

  backend:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.12"] } }   # 3.10 is the oldest version the code supports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt ruff
      - run: cd backend && ruff check --select E9,F --target-version py310 app tests scripts
      - run: cd backend && python -m pytest -q

  backend-postgres:        # same suite on a real PostgreSQL, plus migrations and model/migration drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: paypilot, POSTGRES_PASSWORD: pgtest, POSTGRES_DB: paypilot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paypilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env: { DATABASE_URL: "postgresql://paypilot:pgtest@localhost:5432/paypilot_test" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: cd backend && alembic upgrade head && alembic check
      - run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci && npx tsc --noEmit && npm run build

  e2e:                      # real browser against the real app (PayPal simulator + deterministic stand-in for Gemini)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements.txt -r e2e/requirements.txt && python -m playwright install --with-deps chromium
      - run: cd frontend && npm ci
      - run: python -m pytest e2e -q
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-debug, path: e2e/.artifacts, if-no-files-found: ignore }
